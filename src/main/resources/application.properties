spring.application.name=SpringBoot_CRUD_ResponseEntity
spring.application.message=Welcome to SpringBoot Framework
spring.application.version=4.1.0

server.port=8085

#database configuration code
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/Employee_CRUD
spring.datasource.username=root
spring.datasource.password=mysql


#to updatethe DDL auto update
spring.jpa.hibernate.ddl-auto=update

#for showing the SQL queries
spring.jpa.show-sql=true

#to print formatting SQL command
#Spring.jpa.properties.hibernate.format_sql=true

#for exposing all the features of springboot acutuator we need to add below configration:
#management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoints.web.exposure.include=*

